<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006B5B" />
      <stop offset="50%" stop-color="#01453D" />
      <stop offset="100%" stop-color="#00382E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEEAC" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Haute Couture Royal Diamond Frame -->
  <polygon points="100,10 190,100 100,190 10,100" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#luxuryGlow)" />

  <!-- Inner Delicate Gold Lattice -->
  <polygon points="100,24 176,100 100,176 24,100" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8" />
  <polygon points="100,38 162,100 100,162 38,100" fill="#013A33" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Center Arabian Starburst & Octagram Royal Insignia -->
  <g transform="translate(100, 100)">
    <!-- 8-pointed star overlay -->
    <path d="M 0,-45 L 12,-15 L 45,0 L 12,15 L 0,45 L -12,15 L -45,0 L -12,-15 Z" fill="url(#goldGrad)" />
    <path d="M -32,-32 L 0,-18 L 32,-32 L 18,0 L 32,32 L 0,18 L -32,32 L -18,0 Z" fill="url(#goldGrad)" opacity="0.75" />
    
    <!-- Central Emerald Jewel -->
    <circle cx="0" cy="0" r="14" fill="#006B5B" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#FCEEAC" />
  </g>

  <!-- Corner Flourish Accents -->
  <circle cx="100" cy="18" r="3" fill="url(#goldGrad)" />
  <circle cx="182" cy="100" r="3" fill="url(#goldGrad)" />
  <circle cx="100" cy="182" r="3" fill="url(#goldGrad)" />
  <circle cx="18" cy="100" r="3" fill="url(#goldGrad)" />
</svg>
